name: Mega Checker QA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    name: Python ${{ matrix.python-version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional DKIM verifier for crypto integration tests
        run: python -m pip install "dkimpy==1.1.8"
      - name: Confirm cryptographic verifier is available
        run: python -c "import dkim; assert hasattr(dkim, 'DKIM')"
      - name: Compile all modules
        run: python -m compileall -q mega_checker mega_checker.py
      - name: Built-in self-test
        run: python mega_checker.py self-test
      - name: Unit and real DKIM crypto integration tests
        run: python -m unittest discover -s tests -v
      - name: Termux pip bootstrap shell tests
        run: bash tests/test_termux_pip_bootstrap.sh
