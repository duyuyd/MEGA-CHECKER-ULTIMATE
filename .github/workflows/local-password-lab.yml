name: NPT Local Password Lab APK

on:
  pull_request:
    paths:
      - 'android/offline-password-lab/**'
      - '.github/workflows/local-password-lab.yml'
  push:
    branches: [main]
    paths:
      - 'android/offline-password-lab/**'
      - '.github/workflows/local-password-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compile, sign and test standalone APK on Android 14
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Real Java engine self-test
        run: |
          mkdir -p "$RUNNER_TEMP/npt-password-lab-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/npt-password-lab-tests" \
            android/offline-password-lab/app/src/main/java/vn/nptduy/localpasswordlab/CandidateEngine.java \
            android/offline-password-lab/ci/EngineSelfTest.java
          java -cp "$RUNNER_TEMP/npt-password-lab-tests" vn.nptduy.localpasswordlab.EngineSelfTest

      - name: Build distinct native Android package
        run: gradle -p android/offline-password-lab --no-daemon :app:assembleRelease

      - name: Sign APK and assert no Internet/account permissions
        env:
          LAB_KEYSTORE_B64: ${{ github.ref == 'refs/heads/main' && secrets.NPT_LAB_KEYSTORE_BASE64 || '' }}
          LAB_STORE_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.NPT_LAB_STORE_PASSWORD || '' }}
          LAB_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.NPT_LAB_KEY_PASSWORD || '' }}
          LAB_KEY_ALIAS: ${{ github.ref == 'refs/heads/main' && secrets.NPT_LAB_KEY_ALIAS || '' }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          tool="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          unsigned="android/offline-password-lab/app/build/outputs/apk/release/app-release-unsigned.apk"
          mkdir -p dist/local-password-lab
          apk="dist/local-password-lab/NPT-Local-Password-Lab.apk"

          if [[ -n "${LAB_KEYSTORE_B64:-}" ]]; then
            : "${LAB_STORE_PASSWORD:?Required store password}"
            : "${LAB_KEY_ALIAS:?Required alias}"
            export LAB_KEY_PASSWORD="${LAB_KEY_PASSWORD:-$LAB_STORE_PASSWORD}"
            printf '%s' "$LAB_KEYSTORE_B64" | base64 --decode > "$work/keystore.p12"
            signing_note="Ký bằng khóa NPT Lab được cấu hình trên GitHub."
          else
            export LAB_STORE_PASSWORD="$(openssl rand -hex 32)"
            export LAB_KEY_PASSWORD="$LAB_STORE_PASSWORD"
            LAB_KEY_ALIAS=nptlab
            keytool -genkeypair -noprompt -keystore "$work/keystore.p12" -storetype PKCS12 \
              -storepass:env LAB_STORE_PASSWORD -keypass:env LAB_KEY_PASSWORD \
              -alias "$LAB_KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=NPT Local Password Lab"
            signing_note="Khóa ký theo từng build; để cập nhật mà không gỡ bản cũ, cấu hình keystore cố định."
          fi

          "$tool/zipalign" -P 16 -f 4 "$unsigned" "$work/aligned.apk"
          "$tool/apksigner" sign --ks "$work/keystore.p12" --ks-key-alias "$LAB_KEY_ALIAS" \
            --ks-pass env:LAB_STORE_PASSWORD --key-pass env:LAB_KEY_PASSWORD \
            --out "$apk" "$work/aligned.apk"
          "$tool/apksigner" verify --verbose --print-certs "$apk"
          "$tool/zipalign" -c -P 16 4 "$apk"
          "$tool/aapt" dump permissions "$apk" > "$work/permissions.txt"
          cat "$work/permissions.txt"
          for forbidden in android.permission.INTERNET android.permission.GET_ACCOUNTS \
             android.permission.QUERY_ALL_PACKAGES android.permission.READ_CONTACTS \
             android.permission.READ_SMS android.permission.BIND_ACCESSIBILITY_SERVICE; do
            if grep -Fq "$forbidden" "$work/permissions.txt"; then
              echo "Forbidden permission present: $forbidden" >&2
              exit 1
            fi
          done
          "$tool/aapt" dump badging "$apk" | grep "^package: name='vn.nptduy.localpasswordlab'"
          rm -f -- "$apk.idsig"
          (cd dist/local-password-lab && sha256sum NPT-Local-Password-Lab.apk > SHA256SUMS.txt)
          printf '%s\n\n%s\n\n%s\n' \
            "NPT Local Password Lab 1.0.0 / Android 7+ / commit $GITHUB_SHA." \
            "Không cần mạng, không nhập địa chỉ Gmail; kiểm thử 1 triệu lượt và so khớp mẫu cục bộ." \
            "$signing_note" > dist/local-password-lab/release-notes.txt

      - name: Enable Android emulator acceleration
        run: sudo chmod a+rw /dev/kvm

      - name: Test separately installed APK on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python android/offline-password-lab/ci/device_test.py dist/local-password-lab/NPT-Local-Password-Lab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: npt-local-password-lab-apk
          path: dist/local-password-lab/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish separately signed NPT Local Password Lab APK
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npt-local-password-lab-apk
          path: dist
      - name: Publish independent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS.txt
          tag="npt-local-password-lab-v1.0.0-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" NPT-Local-Password-Lab.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "NPT Local Password Lab v1.0.0 (Android)" \
            --notes-file release-notes.txt
